<!DOCTYPE html>
<html lang="fa">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="نمایشگاه آثار هنری پونه لازار">
        <meta property="og:title" content="نمایشگاه آثار هنری پونه لازار">
        <meta property="og:description" content="جهت مشاهده دعوت نامه روی لینک کلیک کنید">
        <meta property="og:image" content="https://github.com/art-p-lazar/Gallery/blob/master/media/pic/HEAD4.jpg">
        <meta property="og:url" content="https://https://art-p-lazar.github.io/Gallery">
        <meta property="og:type" content="website">
        <meta name="twitter:card" content="https://github.com/art-p-lazar/Gallery/blob/master/media/pic/HEAD4.jpg">
        <meta name="twitter:title" content="نمایشگاه آثار هنری پونه لازار">
        <meta name="twitter:description" content="جهت مشاهده دعوت نامه روی لینک کلیک کنید">
        <meta name="robots" content="index, follow">
        <meta name="author" content="Amir Parsa">

        <title>نمایشگاه | پونه لازار</title>
        <link rel="shortcut icon" href="./media/pic/icon1.png" type="image/x-icon">
        <link rel="stylesheet" href="./Gallery.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    </head>
    <body>
        <section class="hero">
            <img class="hero-header" src="./media/pic/HEAD4.jpg" alt="Pooneh Lazar Art Gallery">
        </section>
        
        <div class="poster-slider swiper">+
            <div class="swiper-wrapper">
                
                <div class="swiper-slide front">
                    <img src="./media/pic/sss.jpg" alt="Poster1">
                </div>
                
                <div class="swiper-slide back">
                    <img src="./media/pic/backp.jpg" alt="Poster0">
                </div>
                
            </div>
        </div>
        
        <div class="slide-hint">
             برای دیدن پوستر بعدی اسلاید کنید →
        </div>
       
        
        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
        
        <script>
            const swiper = new Swiper('.poster-slider', {
                direction: 'horizontal',
                slidesPerView: 1,
                spaceBetween: 20,
                loop: false,
                effect: 'slide',
                speed: 450,});
        </script>

    </body>
</html>
